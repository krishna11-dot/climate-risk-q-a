name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be started by hand from the Actions tab. Without
  # this there is no "Run workflow" button at all, so the only way to
  # exercise CI was to push a commit.
  workflow_dispatch:

# Two kinds of check, deliberately separated so a red build always means
# something is actually broken:
#
#   test        - deterministic, no external quota. Hard-fails.
#   eval-quality - calls the real LLM and compares against aspirational
#                  quality thresholds the project has never met. Reports
#                  its numbers; does not block.
#
# Before this split, every push was guaranteed red: the quality gate
# demands 0.80 and the real scores are 0.778 / 0.473, so the build
# carried no information. See MAINTENANCE.md Round 6.
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: climate_risk
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/climate_risk
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LITELLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      AGENT_PAUSED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql "postgresql://user:pass@localhost:5432/climate_risk" -f "$f"
          done
        env:
          PGPASSWORD: pass

      - name: Run ruff
        run: ruff check .

      - name: Check for shared mutable state across concurrent tasks
        run: python tools/check_shared_concurrent_state.py agents graph guardrails knowledge_graph observability rag evaluation db main.py

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run red team suite
        run: python evaluation/red_team_suite.py

      # Everything above this line is deterministic and hard-fails: it
      # needs no external quota, so a failure means our code is broken.
      #
      # This step and the ragas-score job below are different in kind.
      # They call the real LLM, so they depend on provider rate limits we
      # do not control — the same 7,000 input-tokens-per-minute cap that
      # failed 70 of 91 queries during the 2026-10-05 load test. A quota
      # exhaustion upstream is not a regression in this repository, so it
      # must not turn the build red.
      - name: Generate eval records (real pipeline, needs LLM quota)
        continue-on-error: true
        run: python evaluation/generate_eval_records.py

      # if: always() so the artifact uploads even when generation was
      # rate-limited part-way; partial records still let the scoring job
      # report a trend, and an empty upload is better than a hard stop.
      - name: Upload eval records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-records
          path: evaluation/eval_records.json
          if-no-files-found: warn

  # Answer-quality tracking, deliberately non-blocking. The thresholds
  # (0.80) are targets this project has never met — real scores are 0.778
  # faithfulness and 0.473 relevancy — so gating the build on them made
  # every push red by design, which drains the signal of meaning. The
  # numbers are still computed, logged and visible here; they just do not
  # fail the build. Run score_eval_records.py without --report-only for
  # the strict gate, which is the right check before a release.
  ragas-score:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download eval records
        uses: actions/download-artifact@v4
        with:
          name: eval-records
          path: evaluation/

      # RAGAS needs an older langchain-community that conflicts with the
      # production langgraph/litellm dependency chain in requirements.txt,
      # so it gets its own job with its own dependency set entirely,
      # matching the local .venv-ragas isolation — see
      # evaluation/score_eval_records.py's module docstring for the
      # incident that made this necessary.
      - name: Install ragas dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ragas.txt

      - name: Run real RAGAS scoring (report-only, does not gate the build)
        run: python evaluation/score_eval_records.py --report-only
