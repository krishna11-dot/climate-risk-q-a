name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: climate_risk
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/climate_risk
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LITELLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      AGENT_PAUSED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql "postgresql://user:pass@localhost:5432/climate_risk" -f "$f"
          done
        env:
          PGPASSWORD: pass

      - name: Run ruff
        run: ruff check .

      - name: Check for shared mutable state across concurrent tasks
        run: python tools/check_shared_concurrent_state.py agents graph guardrails knowledge_graph observability rag evaluation db main.py

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run red team suite
        run: python evaluation/red_team_suite.py

      - name: Generate eval records (main venv, real pipeline)
        run: python evaluation/generate_eval_records.py

      - name: Upload eval records
        uses: actions/upload-artifact@v4
        with:
          name: eval-records
          path: evaluation/eval_records.json

  ragas-score:
    needs: test
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download eval records
        uses: actions/download-artifact@v4
        with:
          name: eval-records
          path: evaluation/

      # RAGAS needs an older langchain-community that conflicts with the
      # production langgraph/litellm dependency chain in requirements.txt,
      # so it gets its own job with its own dependency set entirely,
      # matching the local .venv-ragas isolation — see
      # evaluation/score_eval_records.py's module docstring for the
      # incident that made this necessary.
      - name: Install ragas dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ragas.txt

      - name: Run real RAGAS scoring
        run: python evaluation/score_eval_records.py
